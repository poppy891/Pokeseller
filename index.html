<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ PokéSeller</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06090f;
    --panel: #0d1520;
    --panel2: #111c2d;
    --border: #1a2840;
    --accent: #38bdf8;
    --gold: #fbbf24;
    --green: #10b981;
    --red: #ef4444;
    --purple: #8b5cf6;
    --text: #e2e8f0;
    --muted: #64748b;
    --dim: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  /* Header */
  .header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 0 24px; display: flex; align-items: center; gap: 16px;
    height: 58px; position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: var(--gold); letter-spacing: -0.5px; }
  .nav-btn {
    background: none; border: none; color: var(--muted); padding: 6px 14px;
    border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;
    font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  }
  .nav-btn.active, .nav-btn:hover { background: var(--border); color: var(--accent); }
  .btn-add {
    background: var(--accent); border: none; color: #000; padding: 7px 18px;
    border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px;
    font-family: 'DM Sans', sans-serif; margin-left: auto; transition: opacity 0.15s;
  }
  .btn-add:hover { opacity: 0.85; }

  /* API key banner */
  .api-banner {
    background: #1a0a00; border: 1px solid #92400e; border-radius: 12px;
    padding: 16px 20px; margin: 20px 24px; display: flex; align-items: center; gap: 12px;
  }
  .api-banner input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: 'DM Sans', sans-serif;
  }
  .api-banner button {
    background: var(--gold); border: none; color: #000; padding: 8px 16px;
    border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; white-space: nowrap;
  }

  /* Main layout */
  .main { max-width: 980px; margin: 0 auto; padding: 24px 16px; }

  /* Stats grid */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat-icon { font-size: 20px; margin-bottom: 6px; }
  .stat-value { font-size: 22px; font-weight: 800; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Cards list + detail */
  .dashboard { display: grid; grid-template-columns: 1fr; gap: 20px; }
  .dashboard.has-detail { grid-template-columns: 1fr 1.3fr; }

  /* Card row */
  .card-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    cursor: pointer; transition: all 0.15s; margin-bottom: 8px;
  }
  .card-row:hover, .card-row.active { border-color: var(--accent); background: var(--panel2); }
  .card-thumb {
    width: 40px; height: 56px; object-fit: cover; border-radius: 6px;
    background: var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0; overflow: hidden;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card-price { font-weight: 800; font-size: 16px; color: var(--accent); text-align: right; }

  /* Badges */
  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .badge-available { background: #052e16; color: #4ade80; }
  .badge-listed { background: #0c1a4a; color: #93c5fd; }
  .badge-sold { background: #3b0f0f; color: #fca5a5; }

  /* Detail panel */
  .detail { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .detail-header { display: flex; gap: 14px; margin-bottom: 16px; }
  .detail-img { width: 80px; height: 110px; object-fit: cover; border-radius: 10px; border: 2px solid var(--border); background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; overflow: hidden; }
  .detail-img img { width: 100%; height: 100%; object-fit: cover; }
  .section-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .price-box { background: #060e1a; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .price-big { font-size: 28px; font-weight: 800; color: var(--accent); }
  .listing-box { background: #060e1a; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .listing-title { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--accent); line-height: 1.4; margin: 6px 0 8px; word-break: break-word; }
  .status-btns { display: flex; gap: 8px; }
  .status-btn {
    flex: 1; padding: 8px 4px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  }
  .status-btn.active { border-color: var(--accent); background: rgba(56,189,248,0.1); color: var(--accent); }

  /* Add card form */
  .add-view { max-width: 540px; margin: 0 auto; }
  .form-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  .form-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; background: #060e1a; border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 14px; font-size: 14px; font-family: 'DM Sans', sans-serif;
    outline: none; transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field select option { background: var(--panel); }
  .upload-zone {
    border: 2px dashed var(--border); border-radius: 12px; padding: 28px;
    text-align: center; cursor: pointer; transition: border-color 0.2s; position: relative;
  }
  .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .preview-img { max-height: 160px; border-radius: 8px; margin-top: 12px; }
  .btn-primary {
    width: 100%; background: linear-gradient(135deg, var(--accent), #6366f1);
    border: none; color: #fff; padding: 14px; border-radius: 12px;
    font-weight: 800; font-size: 15px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: opacity 0.15s; margin-top: 4px;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { background: var(--border); color: var(--dim); cursor: not-allowed; }
  .btn-secondary {
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 13px;
    font-family: 'DM Sans', sans-serif; margin-top: 10px; width: 100%;
  }

  /* Loading */
  .loading { text-align: center; padding: 40px; }
  .spinner { font-size: 36px; animation: spin 1.2s linear infinite; display: inline-block; margin-bottom: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-msg { color: var(--accent); font-weight: 700; font-size: 15px; }

  /* Result card */
  .result-card { background: #060e1a; border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .result-card .label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

  /* Error */
  .error-box { background: #3b0f0f; border: 1px solid var(--red); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #fca5a5; margin-top: 12px; }

  /* Copy btn */
  .copy-btn { background: var(--border); border: none; color: var(--muted); font-size: 11px; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .copy-btn:hover { color: var(--text); }

  /* Empty state */
  .empty { text-align: center; padding: 60px 20px; color: var(--dim); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  /* Rarity colors */
  .r-secret { color: #fbbf24; background: rgba(251,191,36,0.1); }
  .r-ultra, .r-full { color: #a78bfa; background: rgba(167,139,250,0.1); }
  .r-holo { color: #60a5fa; background: rgba(96,165,250,0.1); }
  .r-uncommon { color: #34d399; background: rgba(52,211,153,0.1); }
  .r-common { color: #94a3b8; background: rgba(148,163,184,0.1); }

  .tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin: 2px; }

  @media (max-width: 640px) {
    .dashboard.has-detail { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">⚡ PokéSeller</div>
  <button class="nav-btn active" id="btn-dashboard" onclick="showView('dashboard')">📊 Dashboard</button>
  <button class="nav-btn" id="btn-settings" onclick="showView('settings')">⚙️ Réglages</button>
  <button class="btn-add" onclick="showView('add')">+ Ajouter une carte</button>
</div>

<!-- API Key banner -->
<div class="api-banner" id="api-banner" style="display:none">
  <span style="font-size:20px">🔑</span>
  <div style="flex:1">
    <div style="font-weight:700;font-size:13px;color:#fbbf24;margin-bottom:4px">Clé API Gemini requise</div>
    <div style="font-size:12px;color:#92400e">Obtiens une clé gratuite sur aistudio.google.com</div>
  </div>
  <input type="password" id="api-key-input" placeholder="AIza..." />
  <button onclick="saveApiKey()">Enregistrer</button>
</div>

<div class="main">

  <!-- DASHBOARD -->
  <div id="view-dashboard">
    <div class="stats" id="stats-grid"></div>
    <div class="dashboard" id="dashboard-grid">
      <div id="cards-list"></div>
      <div id="detail-panel" style="display:none"></div>
    </div>
  </div>

  <!-- ADD CARD -->
  <div id="view-add" style="display:none">
    <div class="add-view">
      <div class="form-card">
        <div class="form-title">➕ Ajouter une carte</div>

        <!-- Step 1: input -->
        <div id="step-input">
          <div class="field">
            <label>📝 Nom de la carte *</label>
            <input type="text" id="card-name-input" placeholder="Ex: Dracaufeu ex, Pikachu Base Set Holo, Mewtwo V..." />
          </div>
          <div class="field">
            <label>🌐 Langue</label>
            <select id="card-lang">
              <option value="FR">Français</option>
              <option value="EN">English</option>
              <option value="JP">日本語</option>
            </select>
          </div>
          <div class="field">
            <label>📦 État</label>
            <select id="card-condition">
              <option value="Near Mint">Near Mint (NM) — Quasi parfait</option>
              <option value="Lightly Played">Lightly Played (LP) — Légèrement joué</option>
              <option value="Moderately Played">Moderately Played (MP) — Moyennement joué</option>
              <option value="Heavily Played">Heavily Played (HP) — Très joué</option>
            </select>
          </div>
          <div class="field">
            <label>🖼️ Photo de la carte (optionnel)</label>
            <div class="upload-zone" id="upload-zone">
              <input type="file" accept="image/*" id="photo-input" onchange="handlePhotoSelect(this)" />
              <div id="upload-placeholder">
                <div style="font-size:32px;margin-bottom:8px">📸</div>
                <div style="font-size:14px;font-weight:600;color:#94a3b8">Clique pour ajouter une photo</div>
                <div style="font-size:12px;color:var(--muted);margin-top:4px">JPG, PNG, WEBP</div>
              </div>
              <img id="photo-preview" class="preview-img" style="display:none" />
            </div>
          </div>
          <button class="btn-primary" onclick="analyzeCard()">⚡ Analyser la carte</button>
          <div id="error-box" class="error-box" style="display:none"></div>
        </div>

        <!-- Step 2: loading -->
        <div id="step-loading" style="display:none">
          <div class="loading">
            <div class="spinner">⚙️</div>
            <div class="loading-msg" id="loading-msg">Analyse en cours...</div>
          </div>
        </div>

        <!-- Step 3: results -->
        <div id="step-result" style="display:none">
          <div id="identified-card"></div>
          <div id="ebay-price"></div>
          <div id="price-adjuster" style="margin-bottom:16px">
            <label style="font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px">💰 Ajuster le prix de vente</label>
            <div style="display:flex;align-items:center;gap:8px">
              <input type="number" id="final-price" step="0.50" min="0.50" style="width:100px;background:#060e1a;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:16px;font-weight:700;font-family:'DM Sans',sans-serif" />
              <span style="color:var(--muted)">€</span>
            </div>
          </div>
          <button class="btn-primary" onclick="generateListing()">✍️ Générer le listing eBay</button>
          <div id="listing-result" style="display:none;margin-top:14px"></div>
          <div id="save-btn-container" style="display:none;margin-top:10px">
            <button class="btn-primary" style="background:linear-gradient(135deg,#10b981,#059669)" onclick="saveCard()">✅ Sauvegarder dans mon stock</button>
          </div>
          <button class="btn-secondary" onclick="resetAdd()">↩️ Recommencer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div id="view-settings" style="display:none">
    <div class="add-view">
      <div class="form-card">
        <div class="form-title">⚙️ Réglages</div>
        <div class="field">
          <label>🔑 Clé API Gemini</label>
          <input type="password" id="settings-api-key" placeholder="AIza..." />
        </div>
        <button class="btn-primary" onclick="saveApiKeyFromSettings()">Enregistrer la clé</button>
        <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Obtenir une clé gratuite :</div>
          <div style="font-size:13px;color:var(--accent)">👉 aistudio.google.com → Get API Key → Create API Key</div>
        </div>
        <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
          <button class="btn-secondary" style="color:var(--red);border-color:var(--red)" onclick="clearData()">🗑️ Effacer toutes les données</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let cards = JSON.parse(localStorage.getItem('pokeseller_cards') || '[]');
let apiKey = localStorage.getItem('pokeseller_gemini_key') || '';
let currentCard = null;
let selectedCardId = null;
let photoBase64 = null;
let photoMime = null;

// ── Init ───────────────────────────────────────────────────────────────────
window.onload = () => {
  if (apiKey) document.getElementById('settings-api-key').value = apiKey;
  checkApiKey();
  renderDashboard();
};

function saveData() {
  localStorage.setItem('pokeseller_cards', JSON.stringify(cards));
}

function saveApiKey() {
  const val = document.getElementById('api-key-input').value.trim();
  if (!val) return;
  apiKey = val;
  localStorage.setItem('pokeseller_gemini_key', apiKey);
  document.getElementById('api-banner').style.display = 'none';
  document.getElementById('settings-api-key').value = apiKey;
}

function saveApiKeyFromSettings() {
  const val = document.getElementById('settings-api-key').value.trim();
  if (!val) return alert('Entre ta clé API');
  apiKey = val;
  localStorage.setItem('pokeseller_gemini_key', apiKey);
  document.getElementById('api-banner').style.display = 'none';
  alert('✅ Clé API enregistrée !');
}

function checkApiKey() {
  if (!apiKey) document.getElementById('api-banner').style.display = 'flex';
}

function clearData() {
  if (!confirm('Effacer toutes les cartes ?')) return;
  cards = [];
  saveData();
  renderDashboard();
  showView('dashboard');
}

// ── Navigation ─────────────────────────────────────────────────────────────
function showView(v) {
  ['dashboard','add','settings'].forEach(x => {
    document.getElementById('view-' + x).style.display = x === v ? 'block' : 'none';
  });
  document.getElementById('btn-dashboard').classList.toggle('active', v === 'dashboard');
  document.getElementById('btn-settings').classList.toggle('active', v === 'settings');
  if (v === 'dashboard') renderDashboard();
}

// ── Rarity helpers ─────────────────────────────────────────────────────────
function rarityClass(r = '') {
  r = r.toLowerCase();
  if (r.includes('secret') || r.includes('special')) return 'r-secret';
  if (r.includes('ultra') || r.includes('full art')) return 'r-ultra';
  if (r.includes('holo')) return 'r-holo';
  if (r.includes('uncommon')) return 'r-uncommon';
  return 'r-common';
}

function trendColor(t) {
  return t === 'hausse' ? '#10b981' : t === 'baisse' ? '#ef4444' : '#fbbf24';
}
function trendIcon(t) {
  return t === 'hausse' ? '↑' : t === 'baisse' ? '↓' : '→';
}

// ── Dashboard ──────────────────────────────────────────────────────────────
function renderDashboard() {
  const avail = cards.filter(c => c.status === 'available').length;
  const listed = cards.filter(c => c.status === 'listed').length;
  const sold = cards.filter(c => c.status === 'sold').length;
  const revenue = cards.filter(c => c.status === 'sold').reduce((s,c) => s + (c.price||0), 0);
  const stock = cards.filter(c => c.status !== 'sold').reduce((s,c) => s + (c.price||0), 0);

  document.getElementById('stats-grid').innerHTML = [
    { icon:'🃏', val: cards.length, label:'Total cartes', color:'#94a3b8' },
    { icon:'📦', val: avail, label:'Disponibles', color:'#10b981' },
    { icon:'🏷️', val: listed, label:'Listées eBay', color:'#38bdf8' },
    { icon:'✅', val: sold, label:'Vendues', color:'#fbbf24' },
    { icon:'💎', val: stock.toFixed(0)+'€', label:'Stock valorisé', color:'#a78bfa' },
    { icon:'💰', val: revenue.toFixed(0)+'€', label:'Revenus', color:'#fbbf24' },
  ].map(s => `
    <div class="stat-card">
      <div class="stat-icon">${s.icon}</div>
      <div class="stat-value" style="color:${s.color}">${s.val}</div>
      <div class="stat-label">${s.label}</div>
    </div>
  `).join('');

  const list = document.getElementById('cards-list');
  if (cards.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🃏</div><div>Aucune carte. Ajoutez-en une !</div></div>`;
  } else {
    list.innerHTML = cards.map(c => `
      <div class="card-row ${selectedCardId === c.id ? 'active' : ''}" onclick="selectCard('${c.id}')">
        <div class="card-thumb">
          ${c.imageUrl ? `<img src="${c.imageUrl}" onerror="this.style.display='none'">` : '🃏'}
        </div>
        <div style="flex:1;min-width:0">
          <div class="card-name">${c.name}</div>
          <div class="card-meta">${c.set || ''} · ${c.number || ''}</div>
          <div style="margin-top:4px">
            <span class="badge tag ${rarityClass(c.rarity)}">${c.rarity || 'N/A'}</span>
            ${c.isHolo ? '<span class="tag" style="background:rgba(139,92,246,0.15);color:#a78bfa">✨ Holo</span>' : ''}
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div class="card-price">${c.price ? c.price.toFixed(2)+'€' : '—'}</div>
          <div style="margin-top:4px"><span class="badge badge-${c.status}">${c.status === 'available' ? 'Disponible' : c.status === 'listed' ? 'Listé eBay' : 'Vendu'}</span></div>
        </div>
      </div>
    `).join('');
  }
}

function selectCard(id) {
  selectedCardId = id;
  const c = cards.find(x => x.id === id);
  if (!c) return;
  renderDashboard();

  const panel = document.getElementById('detail-panel');
  const grid = document.getElementById('dashboard-grid');
  panel.style.display = 'block';
  grid.className = 'dashboard has-detail';

  panel.innerHTML = `
    <div class="detail">
      <div class="detail-header">
        <div class="detail-img">
          ${c.imageUrl ? `<img src="${c.imageUrl}" onerror="this.style.display='none'">` : '🃏'}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:18px;color:#f1f5f9">${c.name}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${c.nameEn || ''}</div>
          <div style="font-size:12px;color:var(--muted)">${c.set || ''} · ${c.number || ''}</div>
          <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">
            <span class="tag ${rarityClass(c.rarity)}">${c.rarity || ''}</span>
            <span class="tag" style="background:var(--border);color:#94a3b8">${c.language || ''}</span>
            <span class="tag" style="background:var(--border);color:#94a3b8">${c.condition || ''}</span>
            ${c.isHolo ? '<span class="tag" style="background:rgba(139,92,246,0.15);color:#a78bfa">✨ Holo</span>' : ''}
            ${c.isReverse ? '<span class="tag" style="background:rgba(96,165,250,0.1);color:#60a5fa">🔄 Reverse</span>' : ''}
          </div>
        </div>
      </div>

      ${c.ebayData ? `
      <div class="price-box">
        <div class="section-label">💰 Prix eBay (ventes terminées)</div>
        <div style="display:flex;gap:16px;align-items:center">
          <div>
            <div class="price-big">${c.ebayData.avgPrice?.toFixed(2)}€</div>
            <div style="font-size:11px;color:var(--muted)">Prix moyen</div>
          </div>
          <div style="flex:1;font-size:12px;color:#94a3b8">
            <div>Min: <b>${c.ebayData.minPrice?.toFixed(2)}€</b> · Max: <b>${c.ebayData.maxPrice?.toFixed(2)}€</b></div>
            <div style="margin-top:4px">Tendance: <b style="color:${trendColor(c.ebayData.trend)}">${trendIcon(c.ebayData.trend)} ${c.ebayData.trend}</b></div>
            <div style="font-size:11px;color:var(--dim);margin-top:2px">${c.ebayData.note || ''}</div>
          </div>
        </div>
      </div>` : ''}

      ${c.listing ? `
      <div class="listing-box">
        <div class="section-label">✍️ Listing eBay</div>
        <div style="font-size:12px;color:#e2e8f0;font-weight:600">Titre EN :</div>
        <div class="listing-title">${c.listing.titleEn || c.listing.title || ''}</div>
        <button class="copy-btn" onclick="copyText('${(c.listing.titleEn || c.listing.title || '').replace(/'/g,"\\'")}')">📋 Copier</button>
        ${c.listing.sellTip ? `<div style="margin-top:10px;font-size:12px;color:var(--gold)">💡 ${c.listing.sellTip}</div>` : ''}
        ${c.listing.shippingTip ? `<div style="font-size:12px;color:#94a3b8;margin-top:4px">📦 ${c.listing.shippingTip}</div>` : ''}
      </div>` : ''}

      <div class="section-label">Changer le statut</div>
      <div class="status-btns">
        <button class="status-btn ${c.status==='available'?'active':''}" onclick="updateStatus('${c.id}','available')">📦 Dispo</button>
        <button class="status-btn ${c.status==='listed'?'active':''}" onclick="updateStatus('${c.id}','listed')">🏷️ Listé</button>
        <button class="status-btn ${c.status==='sold'?'active':''}" onclick="updateStatus('${c.id}','sold')">✅ Vendu</button>
      </div>

      <button class="btn-secondary" style="margin-top:10px;color:var(--red);border-color:var(--red)" onclick="deleteCard('${c.id}')">🗑️ Supprimer</button>
    </div>
  `;
}

function updateStatus(id, status) {
  const c = cards.find(x => x.id === id);
  if (c) { c.status = status; saveData(); selectCard(id); }
}

function deleteCard(id) {
  if (!confirm('Supprimer cette carte ?')) return;
  cards = cards.filter(x => x.id !== id);
  saveData();
  selectedCardId = null;
  document.getElementById('detail-panel').style.display = 'none';
  document.getElementById('dashboard-grid').className = 'dashboard';
  renderDashboard();
}

function copyText(t) {
  navigator.clipboard.writeText(t).then(() => alert('✅ Copié !'));
}

// ── Photo upload ───────────────────────────────────────────────────────────
function handlePhotoSelect(input) {
  const file = input.files[0];
  if (!file) return;
  photoMime = file.type || 'image/jpeg';
  const reader = new FileReader();
  reader.onload = e => {
    photoBase64 = e.target.result.split(',')[1];
    const prev = document.getElementById('photo-preview');
    prev.src = e.target.result;
    prev.style.display = 'block';
    document.getElementById('upload-placeholder').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

// ── Gemini API ─────────────────────────────────────────────────────────────
async function callGemini(prompt, imageBase64 = null, imageMime = null) {
  if (!apiKey) throw new Error('Clé API Gemini manquante. Va dans Réglages.');

  const parts = [];
  if (imageBase64 && imageMime) {
    parts.push({ inlineData: { mimeType: imageMime, data: imageBase64 } });
  }
  parts.push({ text: prompt });

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts }] })
    }
  );

  const data = await res.json();
  if (data.error) throw new Error(data.error.message || 'Erreur Gemini API');
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  return text;
}

function parseJSON(text) {
  try { return JSON.parse(text); } catch {}
  try { return JSON.parse(text.replace(/```json|```/g, '').trim()); } catch {}
  const m = text.match(/\{[\s\S]*\}/);
  if (m) return JSON.parse(m[0]);
  throw new Error('Réponse invalide: ' + text.slice(0, 120));
}

// ── Analyze card ───────────────────────────────────────────────────────────
async function analyzeCard() {
  const name = document.getElementById('card-name-input').value.trim();
  const lang = document.getElementById('card-lang').value;
  const condition = document.getElementById('card-condition').value;

  if (!name) { showError('Entre le nom de la carte.'); return; }
  if (!apiKey) { showError('Clé API manquante. Va dans ⚙️ Réglages.'); return; }

  hideError();
  setStep('loading');
  setLoadingMsg('🔍 Identification de la carte...');

  try {
    const prompt = `Tu es un expert en cartes Pokémon TCG. Identifie cette carte: "${name}" (Langue: ${lang}, État: ${condition}).
Réponds UNIQUEMENT avec un objet JSON valide, sans texte avant ni après, sans markdown.
{
  "name": "Nom français",
  "nameEn": "English name",
  "set": "Nom du set",
  "setCode": "Code set",
  "number": "XXX/YYY",
  "rarity": "Common|Uncommon|Rare|Holo Rare|Ultra Rare|Secret Rare|Full Art|Special Illustration Rare",
  "condition": "${condition}",
  "language": "${lang}",
  "isHolo": false,
  "isReverse": false,
  "estimatedGrade": 8
}`;

    const text = await callGemini(prompt, photoBase64, photoMime);
    const info = parseJSON(text);
    info.condition = condition;
    info.language = lang;

    currentCard = { ...info, id: Date.now().toString(), status: 'available' };
    if (photoBase64) {
      currentCard.imageUrl = 'data:' + photoMime + ';base64,' + photoBase64;
    }

    renderIdentified(currentCard);

    setLoadingMsg('💰 Recherche du prix moyen sur eBay...');

    try {
      const pricePrompt = `Tu es un expert en prix de cartes Pokémon TCG. Donne le prix de marché actuel pour:
Carte: ${info.nameEn || info.name}, Set: ${info.set}, Numéro: ${info.number}, Rareté: ${info.rarity}, État: ${condition}, Langue: ${lang}
Réponds UNIQUEMENT en JSON valide sans markdown:
{"avgPrice":12.50,"minPrice":8.00,"maxPrice":18.00,"trend":"stable","confidence":"moyenne","note":"explication courte"}`;

      const priceText = await callGemini(pricePrompt);
      const ebay = parseJSON(priceText);
      currentCard.ebayData = ebay;
      currentCard.price = ebay.avgPrice;
      renderPrice(ebay);
    } catch {
      currentCard.price = 5.00;
      currentCard.ebayData = { avgPrice: 5, minPrice: 2, maxPrice: 15, trend: 'stable', confidence: 'faible', note: 'Ajuste le prix manuellement' };
      renderPrice(currentCard.ebayData);
    }

    document.getElementById('final-price').value = (currentCard.price || 5).toFixed(2);
    setStep('result');

  } catch(e) {
    setStep('input');
    showError('Erreur : ' + e.message);
  }
}

function renderIdentified(c) {
  document.getElementById('identified-card').innerHTML = `
    <div class="result-card">
      <div class="label">🃏 Carte identifiée</div>
      <div style="display:flex;gap:12px;align-items:center">
        ${c.imageUrl ? `<img src="${c.imageUrl}" style="width:60px;height:84px;object-fit:cover;border-radius:8px">` : '<div style="font-size:32px">🃏</div>'}
        <div>
          <div style="font-weight:800;font-size:16px">${c.name}</div>
          <div style="font-size:12px;color:var(--muted)">${c.nameEn} · ${c.set} · ${c.number}</div>
          <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">
            <span class="tag ${rarityClass(c.rarity)}">${c.rarity}</span>
            <span class="tag" style="background:var(--border);color:#94a3b8">${c.language}</span>
            <span class="tag" style="background:var(--border);color:#94a3b8">${c.condition}</span>
            ${c.isHolo ? '<span class="tag" style="background:rgba(139,92,246,0.15);color:#a78bfa">✨ Holo</span>' : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderPrice(e) {
  document.getElementById('ebay-price').innerHTML = `
    <div class="result-card">
      <div class="label">💰 Estimation de prix</div>
      <div style="display:flex;gap:16px;align-items:center">
        <div>
          <div style="font-size:26px;font-weight:800;color:var(--accent)">${e.avgPrice?.toFixed(2)}€</div>
          <div style="font-size:11px;color:var(--muted)">Prix moyen estimé</div>
        </div>
        <div style="flex:1;font-size:12px;color:#94a3b8">
          <div>Min: <b>${e.minPrice?.toFixed(2)}€</b> · Max: <b>${e.maxPrice?.toFixed(2)}€</b></div>
          <div style="margin-top:3px">Tendance: <b style="color:${trendColor(e.trend)}">${trendIcon(e.trend)} ${e.trend}</b></div>
          <div style="font-size:11px;color:var(--dim);margin-top:2px">${e.note}</div>
        </div>
      </div>
    </div>
  `;
}

// ── Generate listing ───────────────────────────────────────────────────────
async function generateListing() {
  if (!currentCard) return;
  const price = parseFloat(document.getElementById('final-price').value) || currentCard.price;
  currentCard.price = price;

  const btn = document.querySelector('#step-result .btn-primary');
  btn.disabled = true;
  btn.textContent = '⏳ Génération...';

  try {
    const prompt = `Tu es un expert vendeur de cartes Pokémon sur eBay. Crée un listing attractif.
Carte: ${currentCard.name} / ${currentCard.nameEn}, Set: ${currentCard.set} ${currentCard.number}
Rareté: ${currentCard.rarity}, Langue: ${currentCard.language}, État: ${currentCard.condition}
Holo: ${currentCard.isHolo}, Prix: ${price}€

Réponds UNIQUEMENT en JSON valide sans markdown:
{
  "title": "Titre FR eBay SEO max 80 chars",
  "titleEn": "English eBay title SEO max 80 chars",
  "description": "Description courte attractive 3 phrases avec emojis",
  "keywords": ["kw1","kw2","kw3"],
  "sellTip": "meilleur moment ou astuce pour vendre",
  "shippingTip": "conseil expédition"
}`;

    const text = await callGemini(prompt);
    const listing = parseJSON(text);
    currentCard.listing = listing;

    document.getElementById('listing-result').innerHTML = `
      <div class="listing-box">
        <div class="label">✍️ Listing généré</div>
        <div style="font-size:12px;font-weight:600;color:#e2e8f0">Titre EN (eBay international) :</div>
        <div class="listing-title">${listing.titleEn || listing.title}</div>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(listing.titleEn||listing.title).replace(/'/g,"\\'")}').then(()=>alert('✅ Copié !'))">📋 Copier le titre EN</button>
        <div style="font-size:12px;font-weight:600;color:#e2e8f0;margin-top:10px">Titre FR :</div>
        <div class="listing-title" style="color:#94a3b8">${listing.title}</div>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(listing.title).replace(/'/g,"\\'")}').then(()=>alert('✅ Copié !'))">📋 Copier le titre FR</button>
        ${listing.description ? `<div style="margin-top:10px;font-size:12px;color:#94a3b8;line-height:1.5">${listing.description}</div>` : ''}
        ${listing.sellTip ? `<div style="margin-top:10px;font-size:12px;color:var(--gold)">💡 ${listing.sellTip}</div>` : ''}
        ${listing.shippingTip ? `<div style="font-size:12px;color:#94a3b8;margin-top:4px">📦 ${listing.shippingTip}</div>` : ''}
      </div>
    `;
    document.getElementById('listing-result').style.display = 'block';
    document.getElementById('save-btn-container').style.display = 'block';
  } catch(e) {
    alert('Erreur listing: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '✍️ Générer le listing eBay';
  }
}

// ── Save card ──────────────────────────────────────────────────────────────
function saveCard() {
  if (!currentCard) return;
  cards.unshift({ ...currentCard });
  saveData();
  resetAdd();
  showView('dashboard');
  selectedCardId = currentCard.id;
  renderDashboard();
  selectCard(currentCard.id);
}

function resetAdd() {
  currentCard = null;
  photoBase64 = null;
  photoMime = null;
  document.getElementById('card-name-input').value = '';
  document.getElementById('photo-preview').style.display = 'none';
  document.getElementById('upload-placeholder').style.display = 'block';
  document.getElementById('photo-input').value = '';
  document.getElementById('identified-card').innerHTML = '';
  document.getElementById('ebay-price').innerHTML = '';
  document.getElementById('listing-result').style.display = 'none';
  document.getElementById('save-btn-container').style.display = 'none';
  hideError();
  setStep('input');
}

// ── Steps ──────────────────────────────────────────────────────────────────
function setStep(s) {
  ['input','loading','result'].forEach(x => {
    document.getElementById('step-' + x).style.display = x === s ? 'block' : 'none';
  });
}

function setLoadingMsg(m) {
  document.getElementById('loading-msg').textContent = m;
}

function showError(msg) {
  const b = document.getElementById('error-box');
  b.textContent = msg;
  b.style.display = 'block';
}

function hideError() {
  document.getElementById('error-box').style.display = 'none';
}
</script>
